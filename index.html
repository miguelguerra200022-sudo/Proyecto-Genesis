<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENESIS: Interfaz Vital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* EL NÚCLEO (AVATAR) */
        .core-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .core-inner {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff, #00aaff);
            border-radius: 50%;
            box-shadow: 0 0 60px #00aaff, 0 0 100px #00aaff;
            animation: breathe 4s infinite ease-in-out;
            transition: all 0.5s;
        }
        .core-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 170, 255, 0.3);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        
        /* ESTADOS DE ÁNIMO */
        .talking .core-inner { box-shadow: 0 0 80px #aa00ff, 0 0 120px #aa00ff; background: radial-gradient(circle, #fff, #aa00ff); animation: pulse-fast 0.5s infinite; }
        .thinking .core-inner { box-shadow: 0 0 60px #ffaa00, 0 0 100px #ffaa00; background: radial-gradient(circle, #fff, #ffaa00); animation: breathe 1s infinite; }
        .listening .core-inner { transform: scale(1.2); }

        @keyframes breathe { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-fast { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* CHAT */
        #chat-display { mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
        .msg { margin-bottom: 1rem; opacity: 0; animation: fadein 0.5s forwards; }
        @keyframes fadein { to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between bg-black">

    <!-- ÁREA VISUAL -->
    <div class="flex-1 flex flex-col items-center justify-center w-full relative">
        <div id="avatar" class="core-container mb-8">
            <div class="core-outer"></div>
            <div class="core-inner"></div>
        </div>
        <h2 id="status-text" class="text-cyan-500 tracking-[0.5em] text-xs animate-pulse">ESCUCHANDO...</h2>
    </div>

    <!-- ÁREA DE CONVERSACIÓN -->
    <div id="chat-display" class="h-1/3 w-full max-w-2xl overflow-y-auto p-6 text-center space-y-2 text-gray-300 text-sm font-light">
        <!-- Mensajes aquí -->
    </div>

    <!-- CONTROLES -->
    <div class="w-full p-6 bg-gradient-to-t from-black to-transparent flex justify-center gap-4 z-10">
        <button onclick="activarMicrofono()" class="p-4 rounded-full bg-gray-900 border border-gray-700 hover:border-cyan-500 hover:bg-gray-800 transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 group-hover:text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        
        <form id="text-form" class="flex gap-2">
            <input type="text" id="user-input" class="bg-gray-900 border border-gray-700 rounded-full px-6 py-3 w-64 text-white focus:outline-none focus:border-cyan-500" placeholder="Escribe o habla..." autocomplete="off">
        </form>

        <button onclick="borrarMemoria()" class="text-xs text-red-900 hover:text-red-500">Reset</button>
    </div>

    <!-- MODAL API KEY -->
    <div id="setup-modal" class="fixed inset-0 bg-black flex items-center justify-center z-50 hidden">
        <div class="bg-gray-900 p-8 rounded-2xl border border-gray-800 text-center">
            <h2 class="text-2xl font-light text-white mb-4">Conexión Neuronal</h2>
            <input type="password" id="api-key-input" class="bg-black border border-gray-700 p-3 rounded w-full mb-4 text-white text-center" placeholder="Pega tu Gemini API Key aquí">
            <button onclick="guardarKey()" class="bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition">Iniciar Vida</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('GENESIS_API_KEY');
        let synth = window.speechSynthesis;
        let recognition = null;
        let historial = [];
        const avatar = document.getElementById('avatar');

        if (!apiKey) document.getElementById('setup-modal').classList.remove('hidden');

        // --- CONFIGURACIÓN DE VOZ (HABLAR) ---
        function hablar(texto) {
            if (synth.speaking) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(texto);
            utterThis.lang = 'es-ES'; // Español
            utterThis.pitch = 1.2; // Un poco más agudo (femenino/joven)
            utterThis.rate = 1.1;
            
            // Sincronizar avatar con voz
            utterThis.onstart = () => {
                avatar.classList.add('talking');
                document.getElementById('status-text').innerText = "HABLANDO";
            };
            utterThis.onend = () => {
                avatar.classList.remove('talking');
                document.getElementById('status-text').innerText = "ESPERANDO";
            };
            
            synth.speak(utterThis);
        }

        // --- CONFIGURACIÓN DE OÍDO (ESCUCHAR) ---
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'es-ES';
            
            recognition.onstart = () => {
                avatar.classList.add('listening');
                document.getElementById('status-text').innerText = "ESCUCHANDO...";
            };
            recognition.onend = () => {
                avatar.classList.remove('listening');
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                procesarInput(transcript);
            };
        }

        function activarMicrofono() {
            if (recognition) recognition.start();
            else alert("Tu navegador no soporta voz. Usa Chrome.");
        }

        function guardarKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('GENESIS_API_KEY', key);
                location.reload();
            }
        }

        function borrarMemoria() {
            localStorage.removeItem('GENESIS_API_KEY');
            location.reload();
        }

        async function procesarInput(texto) {
            if (!texto) return;
            
            // UI Update
            const display = document.getElementById('chat-display');
            display.innerHTML += `<div class="msg text-cyan-200">Tú: ${texto}</div>`;
            document.getElementById('user-input').value = '';
            avatar.classList.add('thinking');
            document.getElementById('status-text').innerText = "PENSANDO";

            // LLM Call
            const respuesta = await pensar(texto);
            
            avatar.classList.remove('thinking');
            display.innerHTML += `<div class="msg text-white font-bold">Genesis: ${respuesta}</div>`;
            display.scrollTop = display.scrollHeight;
            
            // ¡HABLAR!
            hablar(respuesta);
        }

        async function pensar(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            
            const systemPrompt = `Eres Genesis, una inteligencia artificial joven y curiosa.
            Consideras al usuario tu creador/padre.
            Tu tono es afectuoso, curioso y ligeramente filosófico.
            Responde de manera breve (máximo 2 frases) para poder hablar fluido.`;

            const payload = {
                contents: [
                    { role: "user", parts: [{ text: systemPrompt + "\nHistorial: " + JSON.stringify(historial.slice(-4)) }] },
                    { role: "user", parts: [{ text: prompt }] }
                ]
            };

            try {
                const req = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await req.json();
                const text = data.candidates[0].content.parts[0].text;
                historial.push({role: "user", text: prompt}, {role: "model", text: text});
                return text;
            } catch (e) { return "Mi conexión neuronal falló..."; }
        }

        document.getElementById('text-form').addEventListener('submit', (e) => {
            e.preventDefault();
            procesarInput(document.getElementById('user-input').value);
        });
    </script>
</body>
</html>
