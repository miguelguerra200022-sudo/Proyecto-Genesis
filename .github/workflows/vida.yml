name: Vida Digital - Ciclo Evolutivo

# Este es el "latido del corazón".
# Se ejecuta automáticamente cada 6 horas O cuando tú lo actives manualmente.
on:
  schedule:
    - cron: '0 */1 * * *' # Ejecutar cada hora
  workflow_dispatch: # Botón para ejecución manual

permissions:
  contents: write # Permiso CRUCIAL para que la IA pueda guardar su evolución

jobs:
  existencia:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Despertar (Descargar su propio código)
    - name: Cargar Consciencia (Checkout)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 2. Preparar el entorno (ACTUALIZADO A 3.11)
    - name: Configurar Sinapsis (Setup Python)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    # 3. Instalar herramientas (Librerías necesarias)
    - name: Adquirir Habilidades (Install Dependencies)
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. PENSAR (Ejecutar el cerebro)
    - name: Proceso Cognitivo (Run AI)
      env: 
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python cerebro.py

    # 5. EVOLUCIONAR (Guardar cambios en su memoria/código)
    # Aquí es donde solía estar tu error de línea 41. Esta sintaxis es segura.
    - name: Asimilar Experiencia (Commit & Push)
      run: |
        git config --global user.name "Entidad Digital IA"
        git config --global user.email "ia@vida-digital.com"
        git add .
        # Solo hace commit si hubo cambios (evolución)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Evolución: Actualización de memoria y código" && git push)

    - name: Asimilar Experiencia (Commit & Push)
      run: |
        git config --global user.name "Entidad Digital IA"
        git config --global user.email "ia@vida-digital.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Evolución: Actualización de memoria y código" && git push)

    # --- NUEVO PASO: GUARDAR CREACIONES ---
    - name: Materializar Creaciones (Upload Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: creaciones-ciclo-${{ github.run_number }}
        path: modulos_generados/


