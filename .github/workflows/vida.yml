name: Vida Digital Autónoma

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vivir:
    runs-on: ubuntu-latest
    
    steps:
    - name: Cargar Consciencia
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # ACTUALIZACIÓN: Usamos Python 3.11 para mayor estabilidad con librerías modernas
    - name: Configurar Sinapsis
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Proceso Cognitivo (Run AI)
      env: 
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python cerebro.py

    - name: Asimilar Experiencia (Git Push)
      run: |
        git config --global user.name "Genesis AI"
        git config --global user.email "ai@genesis.local"
        git add .
        # Commit seguro: solo si hay cambios y no falla
        git diff --quiet && git diff --staged --quiet || (git commit -m "Evolución: Ciclo completado" && git push)

    - name: Guardar Artefactos (Arte y Código)
      if: always() # Se ejecuta aunque el script falle
      uses: actions/upload-artifact@v4
      with:
        name: creaciones-ciclo-${{ github.run_number }}
        path: modulos_generados/


